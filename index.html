      background: #F1F5F9;
    }

    }

      background: #94A3B8;
    }

    }

    }

    .a4-sheet {

      min-height: 297mm;
      margin: 0 auto;
      background: #FFFFFF;
      padding: 16mm 15mm;
      box-shadow: 0 10px 35px rgba(15, 23, 42, 0.08);
      border: 1px solid #E2E8F0;
      border-radius: 8px;
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 10mm;
      }
      body {
        background: #FFFFFF !important;
        color: #0F172A !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .no-print,
      #app-sidebar,
      #app-topbar,
      #app-footer,
      #toast-container,
      #mobile-drawer-backdrop {
        display: none !important;
      }
      #main-wrapper {
        margin-left: 0 !important;
        padding: 0 !important;
        width: 100% !important;
      }
      #app-content {
        padding: 0 !important;
        margin: 0 !important;
      }
      .a4-sheet {
        box-shadow: none !important;
        border: none !important;
        border-radius: 0 !important;
        padding: 0 !important;
        max-width: 100% !important;
        min-height: auto !important;
      }
      .print-break-inside-avoid {
        break-inside: avoid;
        page-break-inside: avoid;
      }
      .print-page-break {
        break-before: page;
        page-break-before: always;
      }
    }

    body.high-contrast {
      background-color: #FFFFFF;
      color: #000000;
    }
    body.high-contrast .bg-white {
      border-color: #334155 !important;
    }

    // ---------- 3. PERSISTENT STORE & SINGLE-SESSION ENGINE ----------

    function loadDB() {

    const appState = {

    // Restore tab session on load if still valid in global active sessions map
    (function restoreSessionOnBoot() {
      const tabSess = getCurrentTabSession();
      if (tabSess) {
        const map = getActiveSessionsMap();
        const globalSess = map[tabSess.userId];
        if (globalSess && globalSess.sessionId === tabSess.sessionId) {
          const user = appState.db.users.find(u => u.id === tabSess.userId);
          if (user) {
            appState.currentUser = user;
          }
        } else {
          // Session was kicked by another device/tab!
          setCurrentTabSession(null);
        }
      }
    })();

    // Listen to single-session kick events across tabs
    function handleSessionConflictCheck(incomingUserId, incomingSessionId) {
      const tabSess = getCurrentTabSession();
      if (tabSess && tabSess.userId === incomingUserId && tabSess.sessionId !== incomingSessionId) {
        // Immediately terminate this tab's session
        if (appState.activeExam && appState.activeExam.timerInterval) {
          clearInterval(appState.activeExam.timerInterval);
          teardownExamSecurity();
          appState.activeExam = null;
        }
        setCurrentTabSession(null);
        appState.currentUser = null;
        navigate('#/login');
        showModal({
          title: 'Sesi Ditutup Otomatis (Single-Session Lock)',
          variant: 'danger',
          body: `<p class="text-sm text-slate-600 leading-relaxed">Akun Anda baru saja login dari perangkat/tab lain (<strong>${incomingSessionId}</strong>). Untuk menjaga integritas ujian, sistem membatasi hanya <strong>1 sesi aktif</strong> dalam satu waktu.</p>`,
          confirmText: 'Mengerti',
          hideCancel: true,
        });
      }
    }

    if (channel) {
      channel.onmessage = (ev) => {
        if (ev.data && ev.data.type === 'SESSION_CLAIMED') {
          handleSessionConflictCheck(ev.data.userId, ev.data.sessionId);
        }
      };
    }
    window.addEventListener('storage', (ev) => {
      if (ev.key === SESSIONS_KEY) {
        const tabSess = getCurrentTabSession();
        if (tabSess) {
          const map = getActiveSessionsMap();
          const current = map[tabSess.userId];
          if (!current || current.sessionId !== tabSess.sessionId) {
            handleSessionConflictCheck(tabSess.userId, current ? current.sessionId : 'REVOKED');
          }
        }
      }
    });

    // ---------- 4. SEEDED SHUFFLE & HELPER UTILITIES ----------
    function hashSeed(str) {
      let h = 2166136261 >>> 0;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    function mulberry32(a) {
      return function() {
        let t = a += 0x6D2B79F5;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function seededShuffle(array, seedStr) {
      const copy = [...array];
      const rng = mulberry32(hashSeed(seedStr));
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function formatSeconds(sec) {
      const s = Math.max(0, Math.floor(sec));
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const r = s % 60;
      const pad = (n) => String(n).padStart(2, '0');
      return `${pad(h)}:${pad(m)}:${pad(r)}`;
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function canUserAccessExam(user, exam) {
      if (!user) return false;
      if (user.role === 'superadmin' || user.role === 'admin') return true;
      if (exam.accessLevel === 'free_mitra') {
        // Free for superadmin-registered accounts OR paid_basic / paid_pro
        return user.registeredByAdmin || user.accessType === 'paid_basic' || user.accessType === 'paid_pro';
      }
      if (exam.accessLevel === 'paid_only') {
        return user.accessType === 'paid_pro';
      }
      return false;
    }

    function getRoleLabel(role) {
      if (role === 'superadmin') return 'Superadmin';
      if (role === 'admin') return 'Admin / Guru';
      return 'Siswa';
    }

    function getAccessBadge(user) {

      if (user.registeredByAdmin) return `<span class="text-xs font-semibold text-emerald-700">Free Access (Mitra)</span>`;
      if (user.accessType === 'paid_pro') return `<span class="text-xs font-semibold text-amber-700">Paket Pro (Berbayar)</span>`;
      return `<span class="text-xs font-semibold text-slate-600">Akun Umum</span>`;
    }

    // ---------- 5. TOAST & MODAL SYSTEM ----------
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const colors = {
        success: 'bg-emerald-600 text-white border-emerald-700',
        error: 'bg-rose-600 text-white border-rose-700',
        warning: 'bg-amber-500 text-slate-950 border-amber-600',
        info: 'bg-brand-600 text-white border-brand-700',
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-xl shadow-lg border text-sm font-medium transition-all duration-300 transform translate-y-2 opacity-0 ${colors[type] || colors.info}`;
      el.innerHTML = `<span class="shrink-0">${type === 'error' || type === 'warning' ? icon('alert', 'w-4 h-4') : icon('check', 'w-4 h-4')}</span><span>${escapeHtml(message)}</span>`;
      container.appendChild(el);
      requestAnimationFrame(() => {
        el.classList.remove('translate-y-2', 'opacity-0');
      });
      setTimeout(() => {
        el.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => el.remove(), 300);
      }, 3600);
    }

    function closeModal() {

    document.addEventListener('keydown', (e) => {

    function showModal({ title, body, confirmText = 'Konfirmasi', cancelText = 'Batal', variant = 'primary', hideCancel = false, onConfirm = null }) {
      const btnStyle = variant === 'danger'
        ? 'bg-rose-600 hover:bg-rose-700 text-white'

        <div class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm" role="dialog" aria-modal="true" aria-labelledby="modal-title">
          <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-md w-full overflow-hidden animate-[fadeIn_0.15s_ease-out]">
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">

    // ---------- 6. AUTH & SINGLE-SESSION ENFORCEMENT ----------
    function performLogin(user, forceReplace = false) {
      const map = getActiveSessionsMap();

      if (existing && existing.tabId !== THIS_TAB_ID && !forceReplace) {

        showModal({

          body: `

          cancelText: 'Batal',
          onConfirm: () => {
            closeModal();
            performLogin(user, true);
          }

        return;
      }

      const newSessionId = 'SESS-' + Math.random().toString(36).slice(2, 9).toUpperCase();
      const sessionPayload = {
        userId: user.id,
        sessionId: newSessionId,
        tabId: THIS_TAB_ID,
        deviceLabel: `Browser Tab ${THIS_TAB_ID} (${navigator.platform || 'Web'})`,
        startedAt: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
      };

      map[user.id] = sessionPayload;
      setActiveSessionsMap(map);
      setCurrentTabSession(sessionPayload);
      appState.currentUser = user;

      if (channel) {
        channel.postMessage({ type: 'SESSION_CLAIMED', userId: user.id, sessionId: newSessionId });
      }

      showToast(`Selamat datang, ${user.name}! Sesi tunggal aktif (${newSessionId}).`, 'success');

    function logoutUser() {
      if (appState.activeExam) {
        showToast('Selesaikan atau kumpulkan ujian terlebih dahulu sebelum keluar.', 'warning');
        return;
      }
      const user = appState.currentUser;
      if (user) {
        const map = getActiveSessionsMap();
        const tabSess = getCurrentTabSession();
        if (map[user.id] && tabSess && map[user.id].sessionId === tabSess.sessionId) {
          delete map[user.id];
          setActiveSessionsMap(map);
        }
      }
      setCurrentTabSession(null);
      appState.currentUser = null;
      appState.notifOpen = false;
      navigate('#/login');
      showToast('Anda telah keluar. Sesi aktif dibersihkan.', 'info');
    }

    function simulateDuplicateSession() {
      if (!appState.currentUser) return;
      const map = getActiveSessionsMap();
      const fakeId = 'SESS-OTHER-' + Math.floor(100 + Math.random() * 899);
      map[appState.currentUser.id] = {
        userId: appState.currentUser.id,
        sessionId: fakeId,
        tabId: 'DEVICE-B-MOBILE',
        deviceLabel: 'Simulasi Perangkat Ke-2 (Android Chrome)',
        startedAt: new Date().toLocaleTimeString('id-ID'),

      setActiveSessionsMap(map);

    // ---------- 7. HASH ROUTER ----------
    function navigate(hash) {
      if (window.location.hash !== hash) {
        window.location.hash = hash;
      } else {
        appState.route = hash;
        render();

    window.addEventListener('hashchange', () => {

        showToast('Ujian sedang berjalan! Gunakan tombol Selesai Ujian untuk keluar.', 'warning');
        history.pushState(null, '', `#/exam/${appState.activeExam.examId}`);

      appState.mobileMenuOpen = false;
      render();

    // ---------- 8. BROWSER-LEVEL ANTI-CHEAT & CBT RUNNER ENGINE ----------
    let securityBound = false;

    function recordCheatViolation(reason, severity = 'Sedang') {
      const ex = appState.activeExam;
      if (!ex) return;
      const exam = appState.db.exams.find(e => e.id === ex.examId);
      const user = appState.currentUser;
      if (!exam || !user) return;

      ex.warnings += 1;
      const maxW = exam.maxWarnings || 3;
      const reachedLimit = ex.warnings >= maxW;

      const entry = {
        id: 'log-' + Date.now(),
        userId: user.id,
        userName: user.name,
        className: user.className,
        examId: exam.id,
        examTitle: exam.title,
        type: reason,
        severity: reachedLimit ? 'Tinggi' : severity,
        timestamp: new Date().toLocaleString('id-ID'),
        actionTaken: reachedLimit
          ? `Auto-Submit Ujian (Pelanggaran ${ex.warnings}/${maxW})`
          : `Peringatan ${ex.warnings}/${maxW} Ditampilkan`,
      };

      appState.db.cheatLogs.unshift(entry);
      saveDB(appState.db);
      saveExamProgressToLocal();

      if (reachedLimit) {
        submitActiveExam(`Melebihi batas pelanggaran (${ex.warnings}x: ${reason})`);
        return;
      }

      // Show prominent warning modal
      showModal({
        title: `Peringatan Keamanan Ujian (${ex.warnings}/${maxW})`,
        variant: 'danger',
        hideCancel: true,
        confirmText: 'Saya Mengerti & Kembali ke Layar Penuh',
        body: `
          <div class="space-y-3">
            <div class="p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-sm">
              <p class="font-bold">Aktivitas mencurigakan terdeteksi:</p>
              <p class="mt-1 font-medium">${escapeHtml(reason)}</p>
            </div>
            <p class="text-xs text-slate-600 leading-relaxed">
              Kejadian ini telah dicatat otomatis ke Log Pengawas. Jika Anda mencapai <strong>${maxW} kali pelanggaran</strong>, sistem akan melakukan <strong>Auto-Submit</strong> secara paksa.
            </p>
          </div>
        `,
        onConfirm: () => {
          closeModal();
          tryRequestFullscreen();
        }
      });

      render();
    }

    function tryRequestFullscreen() {
      const el = document.documentElement;
      if (!document.fullscreenElement && el.requestFullscreen) {
        el.requestFullscreen().catch(() => {
          // Graceful fallback if browser blocks programmatic fullscreen without direct gesture
        });
      }
    }

    const onExamContextMenu = (e) => {
      if (!appState.activeExam) return;
      e.preventDefault();
      showToast('Klik kanan diblokir selama ujian berlangsung.', 'warning');
      recordCheatViolation('Percobaan Klik Kanan', 'Rendah');
    };

    const onExamCopyPaste = (e) => {
      if (!appState.activeExam) return;
      e.preventDefault();
      showToast('Copy / Cut / Paste diblokir selama ujian!', 'warning');
      recordCheatViolation(`Percobaan ${e.type.toUpperCase()} Teks Soal`, 'Sedang');
    };

    const onExamKeyDown = (e) => {
      if (!appState.activeExam) return;
      const key = e.key.toLowerCase();
      const forbiddenCombo = (e.ctrlKey || e.metaKey) && ['c', 'v', 'x', 'u', 'p', 's'].includes(key);
      const devTools = e.key === 'F12' || ((e.ctrlKey || e.metaKey) && e.shiftKey && ['i', 'j', 'c'].includes(key));
      if (forbiddenCombo || devTools) {
        e.preventDefault();
        showToast('Shortcut keyboard tersebut diblokir selama ujian.', 'warning');
        recordCheatViolation(`Shortcut Terlarang (${e.key.toUpperCase()})`, 'Sedang');
      }
    };

    const onExamVisibilityChange = () => {
      if (!appState.activeExam) return;
      if (document.hidden) {
        recordCheatViolation('Pindah Tab / Minimize Browser (visibilitychange)', 'Tinggi');
      }
    };

    const onExamWindowBlur = () => {
      if (!appState.activeExam) return;
      // Avoid double trigger if document is already hidden
      if (!document.hidden) {
        recordCheatViolation('Keluar Fokus Jendela Ujian (window blur)', 'Tinggi');
      }
    };

    const onFullscreenChange = () => {
      if (!appState.activeExam) return;
      const exam = appState.db.exams.find(e => e.id === appState.activeExam.examId);
      if (exam && exam.requireFullscreen && !document.fullscreenElement) {
        recordCheatViolation('Keluar dari Mode Layar Penuh (Fullscreen)', 'Sedang');
      }
    };

    function bindExamSecurity() {
      if (securityBound) return;
      document.addEventListener('contextmenu', onExamContextMenu);
      document.addEventListener('copy', onExamCopyPaste);
      document.addEventListener('cut', onExamCopyPaste);
      document.addEventListener('paste', onExamCopyPaste);
      document.addEventListener('keydown', onExamKeyDown);
      document.addEventListener('visibilitychange', onExamVisibilityChange);
      window.addEventListener('blur', onExamWindowBlur);
      document.addEventListener('fullscreenchange', onFullscreenChange);
      securityBound = true;
    }

    function teardownExamSecurity() {
      if (!securityBound) return;
      document.removeEventListener('contextmenu', onExamContextMenu);
      document.removeEventListener('copy', onExamCopyPaste);
      document.removeEventListener('cut', onExamCopyPaste);
      document.removeEventListener('paste', onExamCopyPaste);
      document.removeEventListener('keydown', onExamKeyDown);
      document.removeEventListener('visibilitychange', onExamVisibilityChange);
      window.removeEventListener('blur', onExamWindowBlur);
      document.removeEventListener('fullscreenchange', onFullscreenChange);
      securityBound = false;
      if (document.fullscreenElement && document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
      }
    }

    function saveExamProgressToLocal() {
      const ex = appState.activeExam;
      if (!ex || !appState.currentUser) return;
      const key = `${EXAM_PROGRESS_PREFIX}${appState.currentUser.id}_${ex.examId}`;
      const payload = {
        examId: ex.examId,
        answers: ex.answers,
        flags: ex.flags,
        warnings: ex.warnings,
        endTime: ex.endTime,
        startedAt: ex.startedAt,
        currentIdx: ex.currentIdx,
        savedAt: new Date().toLocaleTimeString('id-ID'),
      };
      localStorage.setItem(key, JSON.stringify(payload));
      ex.lastSavedAt = payload.savedAt;
    }

    function startExamSession(examId) {
      const user = appState.currentUser;
      const exam = appState.db.exams.find(e => e.id === examId);
      if (!user || !exam) return;

      const seedBase = `${user.id}_${exam.id}`;
      const rawQuestions = exam.questionIds
        .map(qid => appState.db.questions.find(q => q.id === qid))
        .filter(Boolean);

      const questionsOrder = exam.shuffleQuestions
        ? seededShuffle(rawQuestions.map(q => q.id), seedBase + '_Q')
        : rawQuestions.map(q => q.id);

      const optionsOrderMap = {};
      rawQuestions.forEach(q => {
        optionsOrderMap[q.id] = exam.shuffleOptions
          ? seededShuffle(q.options.map(o => o.id), seedBase + '_OPT_' + q.id)
          : q.options.map(o => o.id);
      });

      // Check existing saved progress (resume if disconnected!)
      const key = `${EXAM_PROGRESS_PREFIX}${user.id}_${exam.id}`;
      let saved = null;
      try {
        saved = JSON.parse(localStorage.getItem(key) || 'null');
      } catch {}

      const now = Date.now();
      const durationMs = exam.durationMinutes * 60 * 1000;
      const resumed = saved && saved.endTime > now;

      appState.activeExam = {
        examId: exam.id,
        startedAt: resumed ? saved.startedAt : now,
        endTime: resumed ? saved.endTime : (now + durationMs),
        questionsOrder,
        optionsOrderMap,
        answers: resumed ? (saved.answers || {}) : {},
        flags: resumed ? (saved.flags || {}) : {},
        warnings: resumed ? (saved.warnings || 0) : 0,
        currentIdx: resumed ? (saved.currentIdx || 0) : 0,
        isOffline: false,
        lastSavedAt: resumed ? saved.savedAt : new Date().toLocaleTimeString('id-ID'),
        timerInterval: null,
      };

      if (resumed) {
        showToast('Progres jawaban sebelumnya berhasil dipulihkan dari penyimpanan lokal!', 'success');
      }

      saveExamProgressToLocal();
      bindExamSecurity();
      if (exam.requireFullscreen) tryRequestFullscreen();

      appState.activeExam.timerInterval = setInterval(() => {
        if (!appState.activeExam) return;
        const remainingSec = Math.floor((appState.activeExam.endTime - Date.now()) / 1000);
        const timerEl = document.getElementById('exam-timer-display');
        if (timerEl) {
          timerEl.textContent = formatSeconds(remainingSec);
          if (remainingSec <= 300) {
            timerEl.classList.add('text-rose-600', 'animate-pulse');
          }
        }
        if (remainingSec <= 0) {
          submitActiveExam('Waktu Ujian Habis (Auto-Submit)');
        }
      }, 1000);

      navigate(`#/exam/${exam.id}`);
    }

    function submitActiveExam(autoReason = null) {
      const ex = appState.activeExam;
      const user = appState.currentUser;
      if (!ex || !user) return;
      const exam = appState.db.exams.find(e => e.id === ex.examId);
      if (!exam) return;

      if (ex.timerInterval) clearInterval(ex.timerInterval);
      teardownExamSecurity();

      // Calculate automatic grading
      let totalWeight = 0;
      let earnedWeight = 0;
      let correctCount = 0;
      ex.questionsOrder.forEach(qid => {
        const q = appState.db.questions.find(item => item.id === qid);
        if (!q) return;
        const w = q.weight || 10;
        totalWeight += w;
        if (ex.answers[qid] === q.correctOptionId) {
          earnedWeight += w;
          correctCount += 1;
        }
      });

      const score = totalWeight > 0 ? Math.round((earnedWeight / totalWeight) * 100) : 0;
      const durationUsedSec = Math.max(10, Math.floor((Date.now() - ex.startedAt) / 1000));
      const newAttemptId = 'att-' + Date.now().toString().slice(-6);

      const attemptRecord = {
        id: newAttemptId,
        examId: exam.id,
        userId: user.id,
        submittedAt: new Date().toLocaleString('id-ID'),
        durationUsedSec,
        score,
        correctCount,
        totalQuestions: ex.questionsOrder.length,
        passed: score >= exam.passingScore,
        autoSubmittedReason: autoReason,
        violationCount: ex.warnings,
        answers: { ...ex.answers },
      };

      appState.db.attempts.unshift(attemptRecord);
      saveDB(appState.db);

      // Clear temporary local progress
      localStorage.removeItem(`${EXAM_PROGRESS_PREFIX}${user.id}_${exam.id}`);
      appState.activeExam = null;
      appState.printMode = 'student';
      appState.printAttemptId = newAttemptId;

      closeModal();
      showToast(
        autoReason ? `Ujian diakhiri otomatis: ${autoReason}` : `Ujian selesai! Nilai Anda: ${score}`,
        autoReason ? 'warning' : 'success'
      );
      navigate('#/results');
    }

    // ---------- 10. DATA COMPUTATION & SVG CHARTS ----------
    function computeStudentStats(userId) {
      const myAttempts = appState.db.attempts.filter(a => a.userId === userId);
      const count = myAttempts.length;
      const avg = count ? Math.round(myAttempts.reduce((s, a) => s + a.score, 0) / count) : 0;
      const qualified = myAttempts.filter(a => a.passed).length;
      const totalMarks = myAttempts.reduce((s, a) => s + a.score, 0);

      // Subject accuracy
      const subjectMap = {};
      myAttempts.forEach(att => {
        Object.entries(att.answers || {}).forEach(([qid, ansId]) => {
          const q = appState.db.questions.find(item => item.id === qid);
          if (!q) return;
          if (!subjectMap[q.subject]) subjectMap[q.subject] = { correct: 0, total: 0 };
          subjectMap[q.subject].total += 1;
          if (ansId === q.correctOptionId) subjectMap[q.subject].correct += 1;
        });
      });

      const subjects = Object.entries(subjectMap).map(([name, st]) => ({
        name,
        pct: Math.round((st.correct / st.total) * 100),
      }));

      // Fallback rich subjects if fresh student has 0 attempts yet
      const displaySubjects = subjects.length ? subjects : [
        { name: 'Penalaran Umum', pct: 85 },
        { name: 'Matematika Kuantitatif', pct: 78 },
        { name: 'Literasi Indonesia', pct: 82 },
        { name: 'Informatika & Logika', pct: 90 },
      ];

      return { myAttempts, count, avg, qualified, totalMarks, subjects: displaySubjects };
    }

    function renderScoreTrendSVG(attempts) {
      const pointsData = attempts.length >= 2
        ? [...attempts].reverse().slice(-6).map((a, i) => ({ label: `Ujian #${i + 1}`, val: a.score }))
        : [
            { label: '01 Nov', val: 58 },
            { label: '06 Nov', val: 68 },
            { label: '11 Nov', val: 74 },
            { label: '16 Nov', val: 69 },
            { label: '21 Nov', val: 85 },
            { label: '26 Nov', val: 88 },
          ];

      const W = 460, H = 175, padL = 34, padR = 16, padT = 20, padB = 28;
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;

      const coords = pointsData.map((d, i) => {
        const x = padL + (i / Math.max(1, pointsData.length - 1)) * plotW;
        const y = padT + (1 - d.val / 100) * plotH;
        return { ...d, x, y };
      });

      // Smooth cubic path
      let dPath = `M ${coords[0].x} ${coords[0].y}`;
      for (let i = 0; i < coords.length - 1; i++) {
        const p0 = coords[i];
        const p1 = coords[i + 1];
        const cx = (p0.x + p1.x) / 2;
        dPath += ` C ${cx} ${p0.y}, ${cx} ${p1.y}, ${p1.x} ${p1.y}`;
      }
      const areaPath = `${dPath} L ${coords[coords.length - 1].x} ${padT + plotH} L ${coords[0].x} ${padT + plotH} Z`;
      const highlight = coords[Math.max(0, coords.length - 2)];

      return `
        <svg viewBox="0 0 ${W} ${H}" class="w-full h-44 overflow-visible" role="img" aria-label="Grafik tren nilai ujian">
          <defs>
            <linearGradient id="scoreGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#1D6FF2" stop-opacity="0.22"/>
              <stop offset="100%" stop-color="#1D6FF2" stop-opacity="0.01"/>
            </linearGradient>
          </defs>
          ${[0, 25, 50, 75, 100].map(tick => {
            const y = padT + (1 - tick / 100) * plotH;
            return `
              <line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#E2E8F0" stroke-dasharray="3 3" stroke-width="1"/>
              <text x="${padL - 8}" y="${y + 4}" text-anchor="end" fill="#64748B" font-size="10" font-weight="500">${tick}</text>
            `;
          }).join('')}
          <path d="${areaPath}" fill="url(#scoreGrad)"/>
          <path d="${dPath}" fill="none" stroke="#1D6FF2" stroke-width="2.75" stroke-linecap="round"/>
          ${coords.map(c => `
            <circle cx="${c.x}" cy="${c.y}" r="4.5" fill="#FFFFFF" stroke="#1D6FF2" stroke-width="2.5"/>
            <text x="${c.x}" y="${H - 6}" text-anchor="middle" fill="#64748B" font-size="10">${escapeHtml(c.label)}</text>
          `).join('')}
          <g transform="translate(${Math.min(W - 85, Math.max(padL, highlight.x - 32))}, ${Math.max(2, highlight.y - 36)})">
            <rect width="68" height="26" rx="6" fill="#FFFFFF" stroke="#DCE9FE" stroke-width="1.5"/>
            <text x="34" y="13" text-anchor="middle" fill="#0B4CC4" font-size="11" font-weight="700">${highlight.val}%</text>
            <text x="34" y="22" text-anchor="middle" fill="#64748B" font-size="8">${escapeHtml(highlight.label)}</text>
          </g>
        </svg>
      `;
    }

    function renderDonutChartSVG(subjects) {
      const colors = ['#1D6FF2', '#10B981', '#F59E0B', '#7C3AED', '#EC4899'];
      const total = subjects.reduce((s, x) => s + x.pct, 0) || 1;
      const r = 46;
      const circ = 2 * Math.PI * r;
      let offset = 0;

      const segments = subjects.slice(0, 5).map((sub, idx) => {
        const len = (sub.pct / total) * circ;
        const seg = `<circle cx="64" cy="64" r="${r}" fill="transparent" stroke="${colors[idx % colors.length]}" stroke-width="20" stroke-dasharray="${len} ${circ - len}" stroke-dashoffset="${-offset}" />`;
        offset += len;
        return { seg, color: colors[idx % colors.length], ...sub };
      });

      return `
        <div class="flex flex-col sm:flex-row items-center gap-5">
          <div class="relative shrink-0">
            <svg viewBox="0 0 128 128" class="w-32 h-32 -rotate-90" role="img" aria-label="Performa per mata pelajaran">
              ${segments.map(s => s.seg).join('')}
            </svg>
            <div class="absolute inset-0 flex flex-col items-center justify-center">
              <span class="text-xs text-slate-400 font-medium">Rata-rata</span>
              <span class="text-lg font-extrabold text-slate-800">${Math.round(total / subjects.length)}%</span>
            </div>
          </div>
          <div class="flex-1 w-full space-y-2.5">
            ${segments.map(s => `
              <div class="flex items-center justify-between text-xs">
                <div class="flex items-center gap-2 min-w-0">
                  <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${s.color}"></span>
                  <span class="text-slate-600 font-medium truncate">${escapeHtml(s.name)}</span>
                </div>
                <span class="font-bold text-slate-900 ml-2">${s.pct}%</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

                    return `
                      <label class="flex items-start gap-3.5 p-4 rounded-2xl border-2 cursor-pointer transition ${selected ? 'border-brand-600 bg-brand-50/70' : 'border-slate-200 hover:border-brand-300 hover:bg-slate-50'}">
                        <input type="radio" name="q-opt-${qid}" value="${opt.id}" ${selected ? 'checked' : ''} onchange="selectExamAnswer('${qid}', '${opt.id}')" class="sr-only" />

    // 12E. RESULTS & CLASS RECAP (#/results, #/previous-tests)
    function renderResultsView(onlyOwn = false) {
      const user = appState.currentUser;
      const isStaff = user.role === 'admin' || user.role === 'superadmin';
      const showClassRecap = isStaff && !onlyOwn;

      const selectedExamId = appState.recapExamFilter;
      const selectedClass = appState.recapClassFilter;

      let rows = showClassRecap
        ? appState.db.attempts.filter(a => selectedExamId === 'ALL' || a.examId === selectedExamId)
        : appState.db.attempts.filter(a => a.userId === user.id);

      if (showClassRecap && selectedClass !== 'ALL') {
        rows = rows.filter(a => {
          const st = appState.db.users.find(u => u.id === a.userId);
          return st && st.className === selectedClass;
        });
      }

      const avgScore = rows.length ? Math.round(rows.reduce((s, r) => s + r.score, 0) / rows.length) : 0;
      const maxScore = rows.length ? Math.max(...rows.map(r => r.score)) : 0;
      const minScore = rows.length ? Math.min(...rows.map(r => r.score)) : 0;
      const passRate = rows.length ? Math.round((rows.filter(r => r.passed).length / rows.length) * 100) : 0;

      const classes = [...new Set(appState.db.users.filter(u => u.role === 'student').map(u => u.className))];

      return `
        <div class="space-y-6">
          <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-card flex flex-wrap items-center justify-between gap-4">
            <div>
              <h2 class="text-lg font-extrabold text-slate-900">${showClassRecap ? 'Rekap Nilai Kelas & Penilaian Otomatis' : 'Hasil & Riwayat Ujian Anda'}</h2>
              <p class="text-xs text-slate-500 mt-1">Nilai dihitung otomatis oleh sistem saat pengumpulan atau auto-submit.</p>
            </div>
            <div class="flex flex-wrap items-center gap-2.5">
              ${showClassRecap ? `

    // 12F. ITEM ANALYSIS & ANALYTICS VIEW (#/analytics)
    function computeItemAnalysis(examId) {
      const exam = appState.db.exams.find(e => e.id === examId) || appState.db.exams[0];
      const attempts = appState.db.attempts.filter(a => a.examId === exam.id);
      const itemRows = exam.questionIds.map((qid, idx) => {
        const q = appState.db.questions.find(item => item.id === qid);
        if (!q) return null;
        let answered = 0, correct = 0;
        const dist = { a: 0, b: 0, c: 0, d: 0, e: 0 };
        attempts.forEach(a => {
          const ans = a.answers && a.answers[qid];
          if (ans) {
            answered++;
            if (dist[ans] !== undefined) dist[ans]++;
            if (ans === q.correctOptionId) correct++;
          }
        });
        const pIndex = answered ? Math.round((correct / answered) * 100) : 0;
        const category = pIndex >= 75 ? 'Mudah' : pIndex >= 40 ? 'Sedang' : 'Sukar';
        return { no: idx + 1, q, answered, correct, pIndex, category, dist };
      }).filter(Boolean);

      return { exam, attempts, itemRows };
    }

    // 12H. DYNAMIC QUESTION BANK (SUPERADMIN FULL CRUD, PILIHAN GANDA ONLY) (#/admin/question-bank)

      const user = appState.currentUser;

      const subjects = [...new Set(appState.db.questions.map(q => q.subject))];
      const qFilter = appState.searchQuery.toLowerCase();

      const filtered = appState.db.questions.filter(q => {
        if (appState.bankSubjectFilter !== 'ALL' && q.subject !== appState.bankSubjectFilter) return false;
        if (qFilter && !q.text.toLowerCase().includes(qFilter) && !q.subject.toLowerCase().includes(qFilter)) return false;
        return true;

      return `
        <div class="space-y-6">
          <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-card flex flex-wrap items-center justify-between gap-4">

              <select onchange="appState.bankSubjectFilter=this.value;render()" class="px-3 py-2 rounded-xl border border-slate-200 text-xs font-semibold bg-white">
                <option value="ALL">Semua Mata Pelajaran</option>
                ${subjects.map(s => `<option value="${escapeHtml(s)}" ${appState.bankSubjectFilter === s ? 'selected' : ''}>${escapeHtml(s)}</option>`).join('')}
              </select>
              ${isSuperadmin ? `
                <button type="button" onclick="openQuestionEditorModal()" class="px-4 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold flex items-center gap-1.5">
                  ${icon('plus')} Tambah Soal Pilihan Ganda
                </button>
              ` : `<span class="text-xs font-medium text-slate-500">Mode Baca (Edit khusus Superadmin)</span>`}
            </div>
          </div>

          <div class="space-y-4">
            ${filtered.length ? filtered.map((q, idx) => `
              <article class="bg-white rounded-2xl p-5 border border-slate-200 shadow-card">
                <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                  <div class="flex items-center gap-2 text-xs">
                    <span class="font-mono font-bold text-slate-400">${escapeHtml(q.id)}</span>
                    <span class="text-slate-300">·</span>
                    <span class="font-bold text-brand-700">${escapeHtml(q.subject)}</span>
                    <span class="text-slate-300">·</span>
                    <span class="text-slate-500">${escapeHtml(q.difficulty)}, Bobot ${q.weight}</span>
                  </div>
                  ${isSuperadmin ? `
                    <div class="flex items-center gap-2">
                      <button type="button" onclick="openQuestionEditorModal('${q.id}')" class="px-3 py-1.5 rounded-lg bg-brand-50 hover:bg-brand-100 text-brand-700 text-xs font-bold">Edit</button>
                      <button type="button" onclick="deleteQuestion('${q.id}')" class="px-3 py-1.5 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-bold">Hapus</button>
                    </div>
                  ` : ''}

                <p class="text-sm font-semibold text-slate-900 mb-3">${idx + 1}. ${escapeHtml(q.text)}</p>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs">
                  ${q.options.map(opt => `
                    <div class="p-2.5 rounded-xl border ${opt.id === q.correctOptionId ? 'bg-emerald-50 border-emerald-300 text-emerald-900 font-bold' : 'bg-slate-50 border-slate-100 text-slate-600'}">

              </div>
            `}
          </div>
        </div>
      `;
    }

    function switchLoginTab(tab) {
      const loginForm = document.getElementById('login-form');
      const regForm = document.getElementById('register-form');
      const banner = document.getElementById('login-role-banner');
      const emailInput = document.getElementById('login-email');
      const roleInput = document.getElementById('login-role-target');

      document.querySelectorAll('.login-tab-btn').forEach(b => {
        b.classList.remove('bg-white', 'text-brand-600', 'shadow-sm');
        b.classList.add('text-slate-600');
      });
      const activeBtn = document.getElementById(`tab-btn-${tab}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-white', 'text-brand-600', 'shadow-sm');
        activeBtn.classList.remove('text-slate-600');
      }

      if (tab === 'register') {
        loginForm.classList.add('hidden');
        regForm.classList.remove('hidden');
        return;
      }

      loginForm.classList.remove('hidden');
      regForm.classList.add('hidden');
      roleInput.value = tab;

      if (tab === 'student') {
        emailInput.value = 'aryan@sman1.sch.id';
        banner.innerHTML = 'Portal Masuk <strong>Siswa</strong>: akses ujian, token, live test, dan rapor nilai pribadi.';
      } else if (tab === 'admin') {
        emailInput.value = 'guru@sman1.sch.id';
        banner.innerHTML = 'Portal Masuk <strong>Admin / Guru</strong>: kelola jadwal & token ujian, rekap nilai kelas, dan pantau log kecurangan.';
      } else {
        emailInput.value = 'superadmin@tryoutdemo.id';
        banner.innerHTML = 'Portal Masuk <strong>Superadmin</strong>: kendali penuh Bank Soal Pilihan Ganda dinamis, registrasi akun Mitra Gratis, dan paket berbayar.';
      }
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim().toLowerCase();
      const password = document.getElementById('login-password').value;
      const targetRole = document.getElementById('login-role-target').value;

      const user = appState.db.users.find(u => u.email.toLowerCase() === email && u.password === password);
      if (!user) {
        showToast('Email atau kata sandi salah.', 'error');
        return;
      }
      if (user.role !== targetRole) {
        showToast(`Akun ini terdaftar sebagai ${getRoleLabel(user.role)}. Gunakan tab login yang sesuai.`, 'warning');
        return;
      }
      performLogin(user);
    }

    function rotateExamToken(examId) {
      const ex = appState.db.exams.find(e => e.id === examId);

      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let tok = '';
      for (let i = 0; i < 6; i++) tok += chars[Math.floor(Math.random() * chars.length)];
      ex.token = tok;
      saveDB(appState.db);
      showToast(`Token baru untuk ${ex.title}: ${tok}`, 'success');
      render();

    }

    function exportRecapCSV() {
      const header = ['Nama,Kelas,Ujian,Skor,Benar,Total,Status,Pelanggaran,Waktu'];
      const lines = appState.db.attempts.map(a => {
        const u = appState.db.users.find(x => x.id === a.userId) || { name: '-', className: '-' };
        const e = appState.db.exams.find(x => x.id === a.examId) || { title: '-' };
        return `"${u.name}","${u.className}","${e.title}",${a.score},${a.correctCount},${a.totalQuestions},"${a.passed ? 'LULUS' : 'REMEDIAL'}",${a.violationCount},"${a.submittedAt}"`;
      });
      const blob = new Blob([header.concat(lines).join('\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'rekap_nilai_tryout.csv';
      link.click();
      URL.revokeObjectURL(url);
      showToast('File CSV Rekap Nilai Kelas berhasil diunduh.', 'success');
    }

    function toggleMobileMenu(open) {
      appState.mobileMenuOpen = open;
      render();
    }

    function toggleNotif() {
      appState.notifOpen = !appState.notifOpen;
      render();
    }

    function nextAnnouncement() {
      appState.announcementIdx = (appState.announcementIdx + 1) % appState.db.announcements.length;
      render();
    }

    function setAnnouncement(idx) {
      appState.announcementIdx = idx;
      render();
    }

    function handleGlobalSearch(query) {
      appState.searchQuery = query.trim();
      if (!appState.route.startsWith('#/start-exam') && !appState.route.startsWith('#/admin/question-bank')) {
        navigate('#/start-exam');
      } else {
        render();
      }
    }

    function toggleHighContrast() {
      appState.highContrast = !appState.highContrast;
      document.body.classList.toggle('high-contrast', appState.highContrast);
      render();
    }

    function setFontScale(scale) {
      appState.fontScale = scale;
      document.documentElement.style.setProperty('--font-scale', scale);
      render();
    }

    function resetDemoDatabase() {
      localStorage.removeItem(STORE_KEY);
      localStorage.removeItem(SESSIONS_KEY);
      appState.db = loadDB();
      setCurrentTabSession(null);
      appState.currentUser = null;
      navigate('#/login');
      showToast('Data demo telah dikembalikan ke kondisi awal.', 'info');
    }

    // ---------- 14. MAIN RENDER PIPELINE ----------
    function render() {
      const root = document.getElementById('app-root');
      let route = window.location.hash || '#/login';
      appState.route = route;

      // Guard: if not logged in, force #/login
      if (!appState.currentUser) {
        if (route !== '#/login') {
          window.location.hash = '#/login';
        }
        root.innerHTML = renderLoginView();
        return;
      }

      // If logged in and on #/login, go to #/dashboard
      if (route === '#/login' || route === '' || route === '#/') {
        window.location.hash = '#/dashboard';
        return;
      }

      // Active CBT Exam Mode (Full immersive view without sidebar)
      if (route.startsWith('#/exam/')) {
        root.innerHTML = renderActiveExamView();
        return;
      }

      // Route Matching
      let content = '';
      let title = 'Online Exam Portal';
      let subtitle = 'Smart Exams, Better Future';

      if (route === '#/dashboard') {
        content = renderDashboardView();
      } else if (route === '#/start-exam') {
        title = 'Start Exam';
        subtitle = 'Pilih paket TryOut & masukkan token ujian';
        content = renderExamsListView(false);
      } else if (route === '#/live-test') {
        title = 'Live Test';
        subtitle = 'Sesi ujian aktif serentak';
        content = renderExamsListView(true);
      } else if (route === '#/previous-tests') {
        title = 'Previous Tests';
        subtitle = 'Riwayat ujian yang telah Anda selesaikan';
        content = renderResultsView(true);
      } else if (route === '#/results') {
        title = appState.currentUser.role === 'student' ? 'Results' : 'Rekap Nilai Kelas';
        subtitle = 'Penilaian otomatis & status kelulusan';
        content = renderResultsView(false);
      } else if (route === '#/analytics') {
        title = 'Analytics & Item Analysis';
        subtitle = 'Grafik performa dan evaluasi per butir soal';
        content = renderAnalyticsView();
      } else if (route === '#/print-analysis') {
        title = 'Cetak Analisis A4';
        subtitle = 'Layout A4 rapi siap cetak & simpan PDF';
        content = renderPrintAnalysisView();
      } else if (route === '#/study-material') {
        title = 'Study Material';
        subtitle = 'Modul ringkas & pembahasan konsep utama';
        content = renderStudyMaterialView();
      } else if (route === '#/pricing') {
        title = 'Paket & Skalabilitas Akses';
        subtitle = 'Free Access Mitra Superadmin vs Paket Berbayar Umum';
        content = renderPricingView();
      } else if (route === '#/admin/question-bank') {
        title = 'Bank Soal Pilihan Ganda';
        subtitle = 'Kustomisasi dinamis butir soal & kunci jawaban';
        content = renderQuestionBankView();
      } else if (route === '#/admin/exams') {
        title = 'Manajemen Ujian';
        subtitle = 'Token ujian, pengacakan & batas peringatan kecurangan';
        content = renderAdminExamsView();
      } else if (route === '#/admin/proctoring') {
        title = 'Log Kecurangan Browser-Level';
        subtitle = 'Pemantauan pindah tab, fullscreen, & auto-submit';
        content = renderProctoringView();
      } else if (route === '#/admin/users') {
        title = 'Manajemen Akun & Sesi Tunggal';
        subtitle = 'Kontrol 1 sesi aktif & registrasi akun mitra gratis';
        content = renderUsersManagementView();
      } else if (route === '#/profile') {
        title = 'Profil Pengguna';
        subtitle = 'Informasi akun, status akses, & sesi aktif';
        content = renderProfileSettingsView(false);
      } else if (route === '#/settings') {
        title = 'Pengaturan';
        subtitle = 'Preferensi aksesibilitas & keamanan sesi';
        content = renderProfileSettingsView(true);
      } else {
        content = renderDashboardView();
      }

      root.innerHTML = renderAppShell(content, title, subtitle);
    }

    // Boot Application
    render();
  </script>
</body>
</html>
